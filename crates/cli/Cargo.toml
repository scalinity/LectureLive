[package]
name = "lecturelive-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lecturelive"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hound = "3.5.1"
lecturelive-core = { path = "../core" }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tui-input = { version = "0.15.4", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.2"

[dev-dependencies]
rustix = { version = "1.1.5", features = ["process", "pty", "termios"] }
tempfile = "3.27.0"
