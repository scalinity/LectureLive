[package]
name = "lecturelive-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lecturelive"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
hound = "3.5.1"
lecturelive-core = { path = "../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
