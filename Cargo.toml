[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.89"

# Release profile of the Tauri app; cargo reads profiles only from the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# With lto on, stripping host-side proc-macro dylibs leaves rustc unable to load them
# (E0463 for ctor_proc_macro) on rustc 1.96.1 with Xcode 27.0 beta.
[profile.release.build-override]
strip = false

# The capture worker shrinks a window capture every second (spec §7.2). Unoptimised, `image` and
# `xcap` take about 0.8 s of each second in a debug build; optimised, about 21 ms (M5 plan research).
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.xcap]
opt-level = 3

# Mixed mode resamples two sources and steers a drift stage per source (spec §4.2). rubato's resamplers are
# generic, so they compile inside lecturelive-core at its opt-level: unoptimised, the two-hour drift test over
# simulated clocks took 330 s, at opt-level 1 60 s, at opt-level 3 11 s (M6 ledger).
[profile.dev.package.lecturelive-core]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
