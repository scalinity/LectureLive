[project]
name = "lecturelive"
version = "0.1.0"
description = "Live lecture transcription with slide capture and LLM-written notes (Grok Voice Transcribe + grok-4.7)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "sounddevice>=0.5",
]

[project.scripts]
live-notes = "live_notes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["live_notes.py"]
